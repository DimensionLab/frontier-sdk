# Built-in credential providers. The same `[[auth]]` table is what a plugin declares in its
# plugin.toml; declarations with the same id are merged (several plugins may share one
# credential). Nothing in this file is secret.

[[auth]]
id = "frontier"
title = "Frontier server"
category = "Frontier"
kind = "token"
fields = [{ name = "token", title = "Access token", secret = true }]
env = ["FRONTIER_TOKEN"]
scopes_hint = "token issued by your Frontier administrator; sent as a Bearer header to the control plane"

[[auth]]
id = "frontier-oidc"
title = "Frontier OIDC client"
category = "Frontier"
kind = "token"
fields = [{ name = "client_secret", title = "Client secret", secret = true }]
env = ["FRONTIER_OIDC_CLIENT_SECRET"]
scopes_hint = "client secret of the OIDC application registered for the control plane (`auth.mode = \"oidc\"`); only the server needs it, and only when the provider issues one"

[[auth]]
id = "huggingface"
title = "Hugging Face"
category = "Datasets hub"
kind = "token"
fields = [{ name = "token", title = "Access token", secret = true }]
env = ["HF_TOKEN", "HUGGING_FACE_HUB_TOKEN"]
help_url = "https://huggingface.co/settings/tokens"
test = "frontier.auth:test_huggingface"
scopes_hint = "read access to gated datasets you have accepted"
[auth.test_http]
url = "https://huggingface.co/api/whoami-v2"
url_setting = "hub.huggingface_endpoint"
url_path = "/api/whoami-v2"
auth = "bearer"
identity = "/name"

[[auth]]
id = "runpod"
title = "RunPod"
category = "Cloud compute"
kind = "api_key"
fields = [{ name = "api_key", title = "API key", secret = true }]
env = ["RUNPOD_API_KEY"]
help_url = "https://www.runpod.io/console/user/settings"
test = "frontier.auth:test_runpod"
scopes_hint = "read/write key: renting and releasing pods on your account"
[auth.test_http]
url = "https://rest.runpod.io/v1/pods"
auth = "bearer"
count = ""

[[auth]]
id = "anyscale"
title = "Anyscale"
category = "Cloud compute"
kind = "api_key"
fields = [
  { name = "api_key", title = "API key", secret = true },
  { name = "cloud_id", title = "Cloud id", secret = false, required = false, env = ["ANYSCALE_CLOUD_ID"] },
  { name = "project_id", title = "Project id", secret = false, required = false, env = ["ANYSCALE_PROJECT_ID"] },
]
env = ["ANYSCALE_API_KEY"]
help_url = "https://console.anyscale.com/credentials"
scopes_hint = "submitting and stopping jobs in the chosen cloud and project"
[auth.test_http]
url = "https://console.anyscale.com/api/v2/userinfo/"
auth = "bearer"
identity = "/result/email"

[[auth]]
id = "flow360"
title = "Flexcompute Flow360"
category = "Cloud solvers"
kind = "api_key"
fields = [{ name = "api_key", title = "API key", secret = true }]
env = ["FLOW360_APIKEY"]
help_url = "https://flow360.simulation.cloud/account"
scopes_hint = "read access to the projects and cases to import"
[auth.test_http]
url = "https://flow360-api.simulation.cloud/v2/projects?page=0&size=1"
auth = "header:simcloud-api-key"

[[auth]]
id = "luminary"
title = "Luminary Cloud"
category = "Cloud solvers"
kind = "api_key"
fields = [{ name = "api_key", title = "API key", secret = true }]
env = ["LC_API_KEY"]
help_url = "https://app.luminarycloud.com/account/api-keys"
scopes_hint = "read access to the projects and simulations to import"

[[auth]]
id = "simscale"
title = "SimScale"
category = "Cloud solvers"
kind = "api_key"
fields = [
  { name = "api_key", title = "API key", secret = true },
  { name = "api_url", title = "API URL", secret = false, required = false, env = ["SIMSCALE_API_URL"] },
]
env = ["SIMSCALE_API_KEY"]
help_url = "https://www.simscale.com/dashboard/user-settings/api-keys"
scopes_hint = "read access to the projects and simulation runs to import"
[auth.test_http]
url = "https://api.simscale.com/v0/projects?limit=1"
url_field = "api_url"
url_path = "/v0/projects?limit=1"
auth = "header:X-API-KEY"

[[auth]]
id = "rescale"
title = "Rescale"
category = "Cloud solvers"
kind = "api_key"
fields = [
  { name = "api_key", title = "API token", secret = true },
  { name = "api_url", title = "Platform URL", secret = false, required = false, env = ["RESCALE_API_URL"] },
]
env = ["RESCALE_API_KEY"]
help_url = "https://platform.rescale.com/user/settings/api-key/"
scopes_hint = "read access to the jobs whose output files are imported"
[auth.test_http]
url = "https://platform.rescale.com/api/v2/users/me/"
url_field = "api_url"
url_path = "/api/v2/users/me/"
auth = "header:Authorization:Token "
identity = "/email"

[[auth]]
id = "s3"
title = "Amazon S3 (or S3-compatible store)"
category = "Object stores"
kind = "api_key"
fields = [
  { name = "access_key_id", title = "Access key id", secret = false, env = ["AWS_ACCESS_KEY_ID"] },
  { name = "secret_access_key", title = "Secret access key", secret = true, env = ["AWS_SECRET_ACCESS_KEY"] },
  { name = "session_token", title = "Session token", secret = true, required = false, env = ["AWS_SESSION_TOKEN"] },
  { name = "region", title = "Region", secret = false, required = false, env = ["AWS_DEFAULT_REGION"] },
  { name = "endpoint_url", title = "Endpoint URL", secret = false, required = false, env = ["AWS_ENDPOINT_URL"] },
]
help_url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
scopes_hint = "read access to the buckets that hold datasets; write access where runs store artifacts"

[[auth]]
id = "gcs"
title = "Google Cloud Storage"
category = "Object stores"
kind = "file"
fields = [{ name = "credentials_file", title = "Service account key file", secret = false, env = ["GOOGLE_APPLICATION_CREDENTIALS"] }]
help_url = "https://cloud.google.com/iam/docs/keys-create-delete"
scopes_hint = "Storage Object Viewer on the dataset buckets; the key file itself stays where it is, only its path is stored"

[[auth]]
id = "azure"
title = "Azure Blob Storage"
category = "Object stores"
kind = "api_key"
fields = [
  { name = "account", title = "Storage account", secret = false, env = ["AZURE_STORAGE_ACCOUNT"] },
  { name = "key", title = "Account key or SAS token", secret = true, env = ["AZURE_STORAGE_KEY"] },
]
help_url = "https://learn.microsoft.com/azure/storage/common/storage-account-keys-manage"
scopes_hint = "read access to the containers that hold datasets"

[[auth]]
id = "registry"
title = "Container registry"
category = "Compute sites"
kind = "basic"
fields = [
  { name = "server", title = "Registry host", secret = false, env = ["FRONTIER_REGISTRY_SERVER"] },
  { name = "username", title = "User name", secret = false, env = ["FRONTIER_REGISTRY_USERNAME"] },
  { name = "password", title = "Password or access token", secret = true, env = ["FRONTIER_REGISTRY_PASSWORD"] },
]
scopes_hint = "pull access to the trainer and worker images (compute.image, compute.worker_image)"

[[auth]]
id = "ssh"
title = "SSH and SLURM sites"
category = "Compute sites"
kind = "file"
fields = [
  { name = "user", title = "Login name", secret = false, env = ["FRONTIER_SSH_USER"] },
  { name = "identity_file", title = "Private key file", secret = false, required = false, env = ["FRONTIER_SSH_IDENTITY"] },
  { name = "passphrase", title = "Key passphrase", secret = true, required = false },
]
scopes_hint = "default login for --on ssh / --on slurm when a site profile names none; the private key stays in its file, only the path is stored"

[[auth]]
id = "anthropic"
title = "Anthropic"
category = "Model providers"
kind = "api_key"
fields = [{ name = "api_key", title = "API key", secret = true }]
env = ["ANTHROPIC_API_KEY"]
help_url = "https://console.anthropic.com/settings/keys"
scopes_hint = "hosted agent sessions (`frontier prep agent run --hosted`) when policy.ai.data_leaves_site allows them"
[auth.test_http]
url = "https://api.anthropic.com/v1/models?limit=1"
auth = "header:x-api-key"
count = "/data"

[[auth]]
id = "openai"
title = "OpenAI (or any OpenAI-compatible hosted endpoint)"
category = "Model providers"
kind = "api_key"
fields = [
  { name = "api_key", title = "API key", secret = true },
  { name = "base_url", title = "Base URL", secret = false, required = false, env = ["OPENAI_BASE_URL"] },
]
env = ["OPENAI_API_KEY"]
help_url = "https://platform.openai.com/api-keys"
scopes_hint = "hosted agent sessions through the OpenAI-compatible protocol when policy.ai.data_leaves_site allows them"
[auth.test_http]
url = "https://api.openai.com/v1/models"
url_field = "base_url"
url_path = "/models"
auth = "bearer"
count = "/data"

[[auth]]
id = "typesafe"
title = "TypeSafe (Jev judgments)"
category = "Model providers"
kind = "api_key"
fields = [{ name = "api_key", title = "API key", secret = true }]
env = ["TYPESAFE_API_KEY"]
help_url = "https://docs.typesafe.ai/api"
scopes_hint = "System One judgments (choice / noul / score) for the judge backend; hosted, policy-gated"
