[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "frontier-native"
version = "0.9.0"
description = "Native (Rust) core of the DimensionLab Frontier Python SDK"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[tool.maturin]
module-name = "frontier_native"
features = ["pyo3/extension-module"]
