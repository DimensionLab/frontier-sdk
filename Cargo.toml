# Generated by DimensionLab's export tooling. Dependency versions are managed upstream;
# propose changes to member crates, not to this file.
[workspace]
resolver = "3"
members = ["crates/frontier-config/", "crates/frontier-py/", "crates/frontier-telemetry/"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["DimensionLab <hello@dimensionlab.org>"]
repository = "https://github.com/DimensionLab/frontier-sdk"
homepage = "https://dimensionlab.org"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
frontier-connector-openfoam = { version = "0.9.0" }
frontier-connector-vtk = { version = "0.9.0" }
frontier-connectors = { version = "0.9.0" }
frontier-core = { version = "0.9.0" }
frontier-data = { version = "0.9.0" }
frontier-prep-kernels = { version = "0.9.0" }
frontier-telemetry = { path = "crates/frontier-telemetry/", version = "0.9.0" }
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tracing = "0.1"
