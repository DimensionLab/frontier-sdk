[project]
name = "frontier"
version = "0.9.0"
description = "DimensionLab Frontier Python SDK: experiment tracking, datasets and training utilities for Large Physics Models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
native = ["frontier-native>=0.9.0,<0.10.0"]
torch = ["torch>=2.4"]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
frontier-native = { path = "../../crates/frontier-py", editable = true }

[tool.coverage.run]
branch = true
source = ["src"]

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report xml:'../../coverage/packages/frontier/coverage.xml'
 --junitxml='../../reports/packages/frontier/unittests/junit.xml'
"""
